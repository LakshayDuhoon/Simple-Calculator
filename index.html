<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Italiana&family=Karla:ital,wght@0,200..800;1,200..800&family=League+Spartan:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image" href="Images/favicon-32x32.png" />
    <title>Calculator</title>
  </head>
  <body>
    <div class="calc-contaner">
      <main class="Calculator">
        <div class="main-nav">
          <p class="title">calc</p>
          <div class="theme-container">
            <div class="numbers">
              <span>1</span>
              <span>2</span>
              <span>3</span>
            </div>
            <div class="toggle-row">
              <div class="theme-text">THEME</div>
              <div class="toggle-btn">
                <div class="circle"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="screen-container">
          <input type="text" class="screen" readonly />
        </div>
        <div class="buttons-container">
          <div class="buttons">
            <button class="key">7</button>
            <button class="key">8</button>
            <button class="key">9</button>
            <button class="delete">DEL</button>
            <button class="key">4</button>
            <button class="key">5</button>
            <button class="key">6</button>
            <button class="plus">+</button>
            <button class="key">1</button>
            <button class="key">2</button>
            <button class="key">3</button>
            <button class="minus">-</button>
            <button class="multiply">.</button>
            <button class="key">0</button>
            <button class="divide">/</button>
            <button class="key">x</button>
            <button class="reset">RESET</button>
            <button class="equal">=</button>
          </div>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
